<!doctype html>
<html>
<head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="cv" width="496" height="372"></canvas>
<script src="piezas.js"></script>
<script>
  function qFase(t, periodo, dura) { var x = t % periodo; return x < dura ? x / dura : -1; }
</script>
<script src="o-skins.js"></script>
<script>var DRAWX=DRAW;</script>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var id = q.get('id');
  var t = parseFloat(q.get('t') || '2.0');
  var K = parseFloat(q.get('k') || '18');
  var ctx = document.getElementById('cv').getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 496, 372);
  var o = {
    x: 0, y: 0, d: 3, half: HALF[parseInt(q.get('f') || '2', 10)], c: q.get('c') || '#ffff00', t: t,
    s: 400, giro: 40, estira: 1, team: null, qSeg: -1, confeti: 0.35, luz: 1,
    back: function (dist) { return { x: -dist, y: 0, d: 3 }; }
  };
  ctx.save();
  ctx.translate(parseFloat(q.get('cx') || '248'), parseFloat(q.get('cy') || '190'));
  ctx.scale(K, K);
  if (q.get("acc")) { ctx.save(); body(ctx, o); ctx.restore(); ctx.save(); frame(ctx,0,0,o.d); ctx.restore(); }
  DRAW[id](ctx, o);
  ctx.restore();
})();
</script>
</body>
</html>
