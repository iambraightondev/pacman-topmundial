<title>Copa Top Mundial</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Barlow:wght@400;500;600&display=swap">
<style>
  /* Layout: cuatro copas nuevas, cada una en su urna de recreativa, con la
     miniatura al tamaño de la escalera al lado; la de hoy va aparte, pequeña,
     solo para comparar. Un solo mundo visual (la pantalla del juego). */
  :root {
    color-scheme: dark;
    --fondo: #05050c;
    --urna: #0c0c1b;
    --raya: #23234a;
    --tinta: #ebe8ff;
    --tenue: #9a96c4;
    --amarillo: #ffe23a;
    --rosa: #ff66cc;
    --pixel: 'Press Start 2P', 'Courier New', monospace;
    --texto: 'Barlow', 'Segoe UI', system-ui, sans-serif;
  }
  body {
    background: var(--fondo);
    color: var(--tinta);
    font-family: var(--texto);
    font-size: 16px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 28px 56px;
  }
  .pagina { max-width: 1040px; margin-inline: auto; display: grid; gap: 32px; }
  .cabecera { display: flex; flex-wrap: wrap; gap: 20px 32px; align-items: flex-end; justify-content: space-between; }
  .cabecera > div { min-width: 0; }
  .cabecera .titulo { flex: 1 1 320px; }
  h1 {
    font-family: var(--pixel);
    font-size: clamp(18px, 4.6vw, 34px);
    line-height: 1.35;
    color: var(--amarillo);
    text-shadow: 0 0 18px rgba(255, 226, 58, .45);
    margin: 0 0 12px;
    text-wrap: balance;
  }
  .entrada { color: var(--tenue); max-width: 60ch; margin: 0; }
  .hoy { display: flex; align-items: center; gap: 12px; border: 1px solid var(--raya); background: var(--urna); padding: 8px 16px 8px 8px; flex: 0 0 auto; }
  .hoy canvas { width: 84px; aspect-ratio: 200 / 240; display: block; }
  .hoy span { font-family: var(--pixel); font-size: 10px; line-height: 1.7; color: var(--tenue); }

  .copas { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; }
  .urna {
    background: radial-gradient(120% 80% at 50% 34%, #15152e 0%, var(--urna) 62%);
    border: 1px solid var(--raya);
    display: grid;
    grid-template-rows: auto auto 1fr;
    min-width: 0;
  }
  .urna .grande { width: 100%; max-width: 380px; aspect-ratio: 200 / 240; display: block; margin-inline: auto; }
  .urna .pie { display: flex; gap: 14px; align-items: flex-start; padding: 0 18px 18px; }
  .urna .mini { flex: 0 0 auto; display: grid; justify-items: center; gap: 4px; }
  .urna .mini canvas { width: 54px; aspect-ratio: 200 / 240; display: block; }
  .urna .mini span { font-size: 11px; color: var(--tenue); letter-spacing: .04em; text-transform: uppercase; }
  .urna .texto { min-width: 0; }
  .urna h2 { font-family: var(--pixel); font-size: 12px; line-height: 1.6; color: var(--amarillo); margin: 0 0 8px; }
  .urna p { margin: 0; color: var(--tenue); font-size: 15px; }
  .letra { font-family: var(--pixel); font-size: 11px; color: var(--rosa); padding: 14px 18px 0; }
</style>

<div class="pagina">
  <header class="cabecera">
    <div class="titulo">
      <h1>COPA TOP MUNDIAL</h1>
      <p class="entrada">Cuatro copas nuevas de arriba abajo, no retoques de la actual. Cada una con su miniatura al tamaño en que sale en la escalera de trofeos, que es donde más se ve.</p>
    </div>
    <div class="hoy">
      <canvas id="lienzo-hoy" width="200" height="240" aria-label="La copa Top Mundial de hoy"></canvas>
      <span>LA DE<br>HOY</span>
    </div>
  </header>
  <section class="copas" id="copas"></section>
</div>

<script>
(function () {
  'use strict';
  var ORO = ['#fff4b8', '#ffd23a', '#d49c12', '#6e4904'];
  var FANT = ['#ff2a2a', '#ffb8ff', '#35e8ff', '#ffb852'];
  var PI = Math.PI;

  function rgba(h, a) {
    var n = parseInt(h.slice(1), 16);
    return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function metal(c, camino, p, x0, x1) {
    c.beginPath(); camino();
    var g = c.createLinearGradient(x0, 0, x1, 0);
    g.addColorStop(0, p[3]); g.addColorStop(0.16, p[2]);
    g.addColorStop(0.36, p[0]); g.addColorStop(0.52, p[1]);
    g.addColorStop(0.82, p[2]); g.addColorStop(1, p[3]);
    c.fillStyle = g; c.fill();
    c.lineWidth = 2.2; c.strokeStyle = p[3]; c.stroke();
  }
  /* un trazo de metal: sombra, cuerpo y filo de luz */
  function tubo(c, camino, p, ancho) {
    c.lineCap = 'round';
    c.beginPath(); camino(); c.lineWidth = ancho; c.strokeStyle = p[3]; c.stroke();
    c.beginPath(); camino(); c.lineWidth = ancho - 3; c.strokeStyle = p[1]; c.stroke();
    c.beginPath(); camino(); c.lineWidth = Math.max(1, ancho * 0.22); c.strokeStyle = p[0]; c.stroke();
  }

  /* ---------- piezas comunes ---------- */
  /* la peana de tacos oscuros con su placa; devuelve dónde acaba por arriba */
  function peana(c, p, pisos, ancho) {
    var y = 96;
    for (var i = 0; i < pisos; i++) {
      var w = ancho - i * 7, h = 14 - i * 2;
      var g = c.createLinearGradient(0, y - h, 0, y);
      g.addColorStop(0, '#3a2a3e'); g.addColorStop(1, '#16101c');
      c.fillStyle = g; c.fillRect(-w, y - h, w * 2, h);
      c.strokeStyle = '#0a060e'; c.lineWidth = 2; c.strokeRect(-w, y - h, w * 2, h);
      c.fillStyle = 'rgba(255,255,255,.12)'; c.fillRect(-w + 2, y - h + 1, w * 2 - 4, 1.5);
      y -= h;
    }
    metal(c, function () { c.rect(-18, 84.5, 36, 7.5); }, p, -18, 18);
    c.fillStyle = rgba(p[3], 0.7);
    for (var k = -2; k <= 2; k++) c.fillRect(k * 6 - 1.2, 87.6, 2.4, 1.3);
    return y;
  }
  function gemaRedonda(c, x, y, r, col) {
    c.beginPath(); c.arc(x, y, r, 0, PI * 2);
    c.fillStyle = col; c.fill();
    c.lineWidth = 0.9; c.strokeStyle = ORO[3]; c.stroke();
    c.beginPath(); c.arc(x - r * 0.3, y - r * 0.35, r * 0.32, 0, PI * 2);
    c.fillStyle = 'rgba(255,255,255,.75)'; c.fill();
  }
  function gema(c, x, y, r, col, resp) {
    c.save(); c.translate(x, y);
    c.shadowColor = col; c.shadowBlur = 8 + 10 * resp;
    c.beginPath();
    c.moveTo(0, -r); c.lineTo(r * 0.9, -r * 0.2); c.lineTo(0, r); c.lineTo(-r * 0.9, -r * 0.2);
    c.closePath(); c.fillStyle = col; c.fill();
    c.shadowBlur = 0;
    c.beginPath(); c.moveTo(0, -r); c.lineTo(-r * 0.9, -r * 0.2); c.lineTo(0, 0); c.closePath();
    c.fillStyle = 'rgba(255,255,255,.6)'; c.fill();
    c.beginPath(); c.moveTo(0, r); c.lineTo(r * 0.9, -r * 0.2); c.lineTo(0, 0); c.closePath();
    c.fillStyle = 'rgba(0,0,0,.3)'; c.fill();
    c.lineWidth = 1.4; c.strokeStyle = '#ffffff';
    c.beginPath();
    c.moveTo(0, -r); c.lineTo(r * 0.9, -r * 0.2); c.lineTo(0, r); c.lineTo(-r * 0.9, -r * 0.2);
    c.closePath(); c.stroke();
    c.restore();
  }
  function superpastilla(c, x, y, r0, resp) {
    var r = r0 + r0 * 0.25 * resp;
    var h = c.createRadialGradient(x, y, 1, x, y, r * 3.2);
    h.addColorStop(0, 'rgba(255,200,170,' + (0.5 + 0.3 * resp) + ')'); h.addColorStop(1, 'rgba(255,200,170,0)');
    c.fillStyle = h; c.fillRect(x - r * 4, y - r * 4, r * 8, r * 8);
    var g = c.createRadialGradient(x - r * 0.35, y - r * 0.4, 0.5, x, y, r);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#ffd9b0'); g.addColorStop(1, '#e89a6a');
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, PI * 2); c.fill();
  }
  /* Pac-Man plano, el del juego */
  function pac(c, x, y, r, dir, boca) {
    c.fillStyle = '#ffff00'; c.strokeStyle = '#6e4904'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x, y);
    c.arc(x, y, r, dir + boca, dir + PI * 2 - boca); c.closePath();
    c.fill(); c.stroke();
  }
  function fantasmita(c, x, y, w, col) {
    c.beginPath(); c.moveTo(x - w, y + w); c.lineTo(x - w, y); c.arc(x, y, w, PI, 0); c.lineTo(x + w, y + w);
    for (var k = 3; k >= 0; k--) c.lineTo(x - w + k * w / 2 + w / 4, y + (k % 2 ? w * 0.6 : w));
    c.closePath(); c.fillStyle = col; c.fill();
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(x - w * 0.38, y - w * 0.1, w * 0.28, 0, PI * 2); c.arc(x + w * 0.38, y - w * 0.1, w * 0.28, 0, PI * 2); c.fill();
  }
  /* una corona pequeña con la base en (0, 0) */
  function coronita(c, p, k) {
    c.save(); c.scale(k, k);
    metal(c, function () {
      c.moveTo(-14, 0); c.lineTo(-15, -13); c.lineTo(-7.5, -6); c.lineTo(0, -16);
      c.lineTo(7.5, -6); c.lineTo(15, -13); c.lineTo(14, 0); c.closePath();
    }, p, -15, 15);
    metal(c, function () { c.rect(-14.5, -3.2, 29, 4.4); }, p, -15, 15);
    var puntas = [[-15, -13], [0, -16], [15, -13]];
    for (var i = 0; i < 3; i++) {
      c.beginPath(); c.arc(puntas[i][0], puntas[i][1] - 1.2, 2.1, 0, PI * 2);
      c.fillStyle = p[0]; c.fill(); c.lineWidth = 0.9; c.strokeStyle = p[3]; c.stroke();
    }
    c.beginPath(); c.arc(0, -6.6, 2.2, 0, PI * 2);
    c.fillStyle = '#ff2a4a'; c.fill(); c.lineWidth = 0.7; c.strokeStyle = '#fff'; c.stroke();
    c.restore();
  }

  /* el globo de esmalte con el laberinto, de radio R y centro (0, CY) */
  var BLOQUES = (function () {
    var b = [], k;
    var A = [[4, 56], [64, 86], [94, 146], [154, 176], [184, 236], [244, 266], [274, 326], [334, 356]];
    var B = [[10, 80], [100, 170], [190, 260], [280, 350]];
    for (k = 0; k < A.length; k++) { b.push([A[k][0], A[k][1], 13, 36]); b.push([A[k][0], A[k][1], -36, -13]); }
    for (k = 0; k < B.length; k++) { b.push([B[k][0], B[k][1], 46, 64]); b.push([B[k][0], B[k][1], -64, -46]); }
    return b;
  })();
  function globoLaberinto(c, t, R, CY) {
    var rot = t * 0.35;
    function proy(lon, lat) {
      var a = lon * PI / 180 + rot, b = lat * PI / 180;
      return { x: R * Math.cos(b) * Math.sin(a), y: CY - R * Math.sin(b), z: Math.cos(b) * Math.cos(a) };
    }
    function tramo(l0, a0, l1, a1) {
      var n = Math.max(2, Math.ceil(Math.abs(l1 - l0) / 4) + Math.ceil(Math.abs(a1 - a0) / 6)), abierto = false;
      for (var i = 0; i <= n; i++) {
        var q = proy(l0 + (l1 - l0) * i / n, a0 + (a1 - a0) * i / n);
        if (q.z < 0.06) { abierto = false; continue; }
        if (abierto) c.lineTo(q.x, q.y); else { c.moveTo(q.x, q.y); abierto = true; }
      }
    }
    var g = c.createRadialGradient(-R * 0.32, CY - R * 0.37, 3, 0, CY, R);
    g.addColorStop(0, '#2a2f7a'); g.addColorStop(0.45, '#0c0f3a'); g.addColorStop(1, '#02020c');
    c.fillStyle = g;
    c.beginPath(); c.arc(0, CY, R, 0, PI * 2); c.fill();
    c.save();
    c.beginPath(); c.arc(0, CY, R - 1, 0, PI * 2); c.clip();
    c.lineJoin = 'round'; c.lineCap = 'round';
    c.beginPath();
    for (var i = 0; i < BLOQUES.length; i++) {
      var b = BLOQUES[i];
      tramo(b[0], b[2], b[1], b[2]); tramo(b[1], b[2], b[1], b[3]);
      tramo(b[1], b[3], b[0], b[3]); tramo(b[0], b[3], b[0], b[2]);
    }
    c.shadowColor = '#3b4bff'; c.shadowBlur = 4;
    c.strokeStyle = '#4a5bff'; c.lineWidth = 1.7; c.stroke();
    c.shadowBlur = 0;
    c.fillStyle = '#ffd9b0';
    var filas = [41, -41, 0];
    for (var f = 0; f < 3; f++) for (var lon = 0; lon < 360; lon += 15) {
      var q = proy(lon, filas[f]);
      if (q.z < 0.15) continue;
      c.beginPath(); c.arc(q.x, q.y, 1.1 * (0.5 + 0.5 * q.z), 0, PI * 2); c.fill();
    }
    var br = c.createRadialGradient(-R * 0.37, CY - R * 0.42, 1, -R * 0.37, CY - R * 0.42, R * 0.63);
    br.addColorStop(0, 'rgba(255,255,255,.28)'); br.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = br; c.fillRect(-R, CY - R, R * 2, R * 2);
    c.restore();
    c.lineWidth = 3.4; c.strokeStyle = ORO[3];
    c.beginPath(); c.arc(0, CY, R, 0, PI * 2); c.stroke();
    c.lineWidth = 1.6; c.strokeStyle = ORO[1];
    c.beginPath(); c.arc(0, CY, R, 0, PI * 2); c.stroke();
  }

  /* ================= A · EL CÁLIZ IMPERIAL ================= */
  function caliz(c, p, t, resp) {
    var y0 = peana(c, p, 3, 40);                      // acaba en 60
    metal(c, function () {
      c.moveTo(-25, y0); c.lineTo(25, y0); c.lineTo(14, y0 - 9); c.lineTo(-14, y0 - 9); c.closePath();
    }, p, -25, 25);
    metal(c, function () {
      c.moveTo(-5, y0 - 9); c.lineTo(5, y0 - 9); c.lineTo(4, 22); c.lineTo(-4, 22); c.closePath();
    }, p, -5, 5);
    metal(c, function () { c.ellipse(0, 38, 10, 5.5, 0, 0, PI * 2); }, p, -10, 10);
    /* las asas, por detrás del vaso */
    for (var lado = -1; lado <= 1; lado += 2) {
      c.save(); c.scale(lado, 1);
      tubo(c, function () { c.moveTo(33, -44); c.bezierCurveTo(74, -54, 68, -2, 22, 8); }, p, 9);
      tubo(c, function () { c.arc(36, -46, 4, 0, PI * 2); }, p, 5);
      c.restore();
    }
    /* el vaso */
    metal(c, function () {
      c.moveTo(-40, -52); c.bezierCurveTo(-40, -8, -22, 14, -7, 23); c.lineTo(7, 23);
      c.bezierCurveTo(22, 14, 40, -8, 40, -52); c.closePath();
    }, p, -40, 40);
    /* el laurel grabado, a los lados del medallón */
    c.fillStyle = rgba(p[3], 0.55);
    for (lado = -1; lado <= 1; lado += 2) {
      for (var h = 0; h < 5; h++) {
        var a = 0.5 + h * 0.42, lx = lado * (20 + Math.sin(a) * 9), ly = -2 - h * 6.4;
        c.save(); c.translate(lx, ly); c.rotate(lado * (0.9 - h * 0.12));
        c.beginPath(); c.ellipse(0, 0, 4.2, 1.7, 0, 0, PI * 2); c.fill(); c.restore();
      }
    }
    /* el medallón: Pac-Man en relieve */
    metal(c, function () { c.arc(0, -14, 15.5, 0, PI * 2); }, [p[1], p[2], p[2], p[3]], -16, 16);
    c.beginPath(); c.arc(0, -14, 12.4, 0, PI * 2); c.fillStyle = '#0a0d33'; c.fill();
    pac(c, -1, -14, 8.6, 0, 0.18 + 0.5 * Math.abs(Math.sin(t * 5)));
    c.fillStyle = '#ffd9b0'; c.beginPath(); c.arc(8.6, -14, 1.2, 0, PI * 2); c.fill();
    /* la cenefa de gemas: los cuatro fantasmas */
    for (var k = 0; k < 4; k++) {
      var gx = -27 + k * 18;
      gemaRedonda(c, gx, -41 + gx * gx * 0.0035, 3.3, FANT[k]);
    }
    metal(c, function () { c.ellipse(0, -52, 41, 7, 0, 0, PI * 2); }, p, -41, 41);
    /* la tapa y su corona */
    metal(c, function () {
      c.moveTo(-37, -54); c.bezierCurveTo(-34, -84, 34, -84, 37, -54);
      c.bezierCurveTo(20, -49, -20, -49, -37, -54); c.closePath();
    }, p, -37, 37);
    metal(c, function () { c.ellipse(0, -76, 9, 3.2, 0, 0, PI * 2); }, p, -9, 9);
    c.save(); c.translate(0, -77); coronita(c, p, 0.95); c.restore();
  }

  /* ================= B · EL PAC-MAN DE ORO ================= */
  function pacOro(c, p, t, resp) {
    var y0 = peana(c, p, 2, 40);                      // acaba en 70
    /* los cuatro fantasmas, esmaltados en el taco de arriba */
    for (var k = 0; k < 4; k++) fantasmita(c, -19.5 + k * 13, 75, 3.8, FANT[k]);
    /* la columna */
    metal(c, function () { c.rect(-19, y0 - 8, 38, 8); }, p, -19, 19);
    metal(c, function () {
      c.moveTo(-10, y0 - 8); c.lineTo(10, y0 - 8); c.lineTo(8, 24); c.lineTo(-8, 24); c.closePath();
    }, p, -10, 10);
    c.strokeStyle = rgba(p[3], 0.55); c.lineWidth = 1;
    for (k = -1; k <= 1; k++) { c.beginPath(); c.moveTo(k * 4.6, y0 - 10); c.lineTo(k * 3.8, 26); c.stroke(); }
    metal(c, function () { c.rect(-15, 17, 30, 7); }, p, -15, 15);
    metal(c, function () { c.ellipse(0, 16, 22, 5, 0, 0, PI * 2); }, p, -22, 22);
    /* la estatua */
    var R = 40, cy = -26, boca = 0.2 + 0.36 * (0.5 + 0.5 * Math.sin(t * 3));
    /* el fondo de la boca */
    var gb = c.createRadialGradient(4, cy, 2, 0, cy, R);
    gb.addColorStop(0, '#3a1600'); gb.addColorStop(1, '#7a4a04');
    c.fillStyle = gb;
    c.beginPath(); c.moveTo(0, cy); c.arc(0, cy, R - 1.5, -boca - 0.05, boca + 0.05); c.closePath(); c.fill();
    var g = c.createRadialGradient(-13, cy - 16, 4, 0, cy, R);
    g.addColorStop(0, '#fff8cc'); g.addColorStop(0.38, '#ffd83a');
    g.addColorStop(0.82, '#c08a0c'); g.addColorStop(1, '#6e4904');
    c.fillStyle = g;
    c.beginPath(); c.moveTo(0, cy); c.arc(0, cy, R, boca, PI * 2 - boca); c.closePath(); c.fill();
    c.lineWidth = 2.4; c.strokeStyle = p[3]; c.lineJoin = 'round'; c.stroke();
    /* el ojo: un zafiro */
    gemaRedonda(c, 5, cy - 21, 4.6, '#2a3cff');
    /* la corona, ladeada */
    c.save(); c.translate(-9, cy - R + 5); c.rotate(-0.22); coronita(c, p, 1.25); c.restore();
    /* lo que se va a comer */
    superpastilla(c, 60, cy, 5.2, resp);
    c.fillStyle = '#ffd9b0';
    c.beginPath(); c.arc(76, cy, 1.8, 0, PI * 2); c.fill();
    c.beginPath(); c.arc(88, cy, 1.8, 0, PI * 2); c.fill();
  }

  /* ================= C · EL PLANETA ================= */
  function planeta(c, p, t, resp) {
    var y0 = peana(c, p, 2, 38);                      // acaba en 70
    metal(c, function () {
      c.moveTo(-24, y0); c.lineTo(24, y0); c.bezierCurveTo(12, y0 - 6, 6, 52, 4.5, 40);
      c.lineTo(-4.5, 40); c.bezierCurveTo(-6, 52, -12, y0 - 6, -24, y0); c.closePath();
    }, p, -24, 24);
    metal(c, function () {
      c.moveTo(-4.5, 41); c.lineTo(4.5, 41); c.lineTo(3.5, 6); c.lineTo(-3.5, 6); c.closePath();
    }, p, -4.5, 4.5);
    metal(c, function () { c.ellipse(0, 26, 8, 4.2, 0, 0, PI * 2); }, p, -8, 8);
    var R = 33, CY = -36, RX = 61, RY = 15, INCL = -0.3;
    /* la cuna que lo sujeta */
    tubo(c, function () { c.arc(0, CY, R + 5, PI * 0.2, PI * 0.8); }, p, 8);
    function enAnillo(a) {
      var x = RX * Math.cos(a), y = RY * Math.sin(a);
      return { x: x * Math.cos(INCL) - y * Math.sin(INCL), y: CY + x * Math.sin(INCL) + y * Math.cos(INCL) };
    }
    function medioAnillo(delante) {
      c.save(); c.translate(0, CY); c.rotate(INCL);
      tubo(c, function () { c.ellipse(0, 0, RX, RY, 0, delante ? 0 : PI, delante ? PI : PI * 2); }, p, 6.5);
      c.restore();
    }
    var N = 18, paso = PI * 2 / N, a = t * 0.8;
    function viajeros(delante) {
      for (var i = 0; i < N; i++) {
        var th = i * paso, d = ((th - a) % (PI * 2) + PI * 2) % (PI * 2);
        if ((Math.sin(th) > 0) !== delante || d > PI * 1.2 || d < 0.2) continue;
        var q = enAnillo(th);
        c.beginPath(); c.arc(q.x, q.y, 1.9, 0, PI * 2);
        c.fillStyle = '#fffbe6'; c.fill(); c.lineWidth = 0.8; c.strokeStyle = p[3]; c.stroke();
      }
      if ((Math.sin(a) > 0) === delante) {
        var pq = enAnillo(a), sig = enAnillo(a + 0.05);
        pac(c, pq.x, pq.y, 8, Math.atan2(sig.y - pq.y, sig.x - pq.x), 0.15 + 0.5 * Math.abs(Math.sin(t * 9)));
      }
    }
    medioAnillo(false); viajeros(false);
    globoLaberinto(c, t, R, CY);
    medioAnillo(true); viajeros(true);
    /* la estrella de arriba */
    c.save(); c.translate(0, CY - R - 9); c.rotate(Math.sin(t * 1.2) * 0.12);
    metal(c, function () {
      for (var i = 0; i < 10; i++) {
        var r = i % 2 ? 3.4 : 8, an = -PI / 2 + i * PI / 5;
        if (i) c.lineTo(Math.cos(an) * r, Math.sin(an) * r); else c.moveTo(Math.cos(an) * r, Math.sin(an) * r);
      }
      c.closePath();
    }, p, -8, 8);
    c.restore();
  }

  /* ================= D · LA CORONA ================= */
  function corona(c, p, t, resp) {
    var y0 = peana(c, p, 2, 42);                      // acaba en 70
    /* el cojín de terciopelo */
    var gc = c.createLinearGradient(0, 44, 0, y0);
    gc.addColorStop(0, '#8a35e0'); gc.addColorStop(1, '#2c0a5e');
    c.beginPath();
    c.moveTo(-41, y0); c.bezierCurveTo(-52, 52, -30, 42, 0, 45);
    c.bezierCurveTo(30, 42, 52, 52, 41, y0); c.closePath();
    c.fillStyle = gc; c.fill(); c.lineWidth = 2; c.strokeStyle = '#16052e'; c.stroke();
    c.beginPath(); c.moveTo(-38, y0 - 3); c.bezierCurveTo(-20, y0 - 7, 20, y0 - 7, 38, y0 - 3);
    c.lineWidth = 1.4; c.strokeStyle = p[1]; c.stroke();
    [-1, 1].forEach(function (lado) {
      metal(c, function () { c.ellipse(lado * 43, y0 - 1, 3.2, 4.6, 0, 0, PI * 2); }, p, lado * 43 - 3, lado * 43 + 3);
    });
    /* el gorro de terciopelo, que asoma entre las puntas */
    var gv = c.createRadialGradient(-8, -12, 3, 0, 4, 34);
    gv.addColorStop(0, '#c0304a'); gv.addColorStop(1, '#4a0818');
    c.fillStyle = gv; c.beginPath(); c.ellipse(0, 8, 31, 30, 0, 0, PI * 2); c.fill();
    /* las cinco puntas */
    metal(c, function () {
      c.moveTo(-34, 34); c.lineTo(-43, -18); c.lineTo(-30, 6); c.lineTo(-21, -34); c.lineTo(-10, 6);
      c.lineTo(0, -46); c.lineTo(10, 6); c.lineTo(21, -34); c.lineTo(30, 6); c.lineTo(43, -18);
      c.lineTo(34, 34); c.quadraticCurveTo(0, 46, -34, 34); c.closePath();
    }, p, -43, 43);
    /* el aro */
    metal(c, function () {
      c.moveTo(-35, 28); c.lineTo(-35, 44); c.quadraticCurveTo(0, 57, 35, 44);
      c.lineTo(35, 28); c.quadraticCurveTo(0, 41, -35, 28); c.closePath();
    }, p, -35, 35);
    /* las gemas del aro: el azul del laberinto en el centro, rubíes a los lados */
    gemaRedonda(c, -24, 39.5, 3.4, '#ff2a4a'); gemaRedonda(c, 24, 39.5, 3.4, '#ff2a4a');
    gema(c, 0, 42.5, 6.6, '#3b4bff', resp);
    /* las puntas, rematadas con los colores de los fantasmas... */
    var puntas = [[-43, -18, 0], [-21, -34, 1], [21, -34, 2], [43, -18, 3]];
    for (var k = 0; k < 4; k++) gemaRedonda(c, puntas[k][0], puntas[k][1] - 3, 4.2, FANT[puntas[k][2]]);
    /* ...y la del centro, con Pac-Man comiéndose su superpastilla */
    superpastilla(c, 13, -57, 2.6, resp);
    pac(c, 0, -57, 9.5, 0, 0.14 + 0.5 * Math.abs(Math.sin(t * 6)));
  }

  /* ================= la de hoy, para comparar ================= */
  function hoy(c, p, t, resp) {
    peana(c, p, 2, 36);
    metal(c, function () {
      c.moveTo(-24, 70); c.lineTo(24, 70); c.lineTo(18, 44); c.lineTo(8, 36);
      c.lineTo(-8, 36); c.lineTo(-18, 44); c.closePath();
    }, p, -24, 24);
    for (var i = 0; i < 2; i++) {
      var g = c.createLinearGradient(-20, 0, 20, 0);
      g.addColorStop(0, '#0b3d22'); g.addColorStop(0.4, '#2fd07a'); g.addColorStop(1, '#0b3d22');
      c.fillStyle = g; c.fillRect(-18 + i * 2, 50 + i * 9, 36 - i * 4, 4);
    }
    for (var lado = -1; lado <= 1; lado += 2) {
      c.save(); c.scale(lado, 1);
      tubo(c, function () { c.moveTo(6, 40); c.bezierCurveTo(36, 20, 50, -10, 30, -34); }, p, 12);
      c.restore();
    }
    var R = 38, CY = -40;
    var gg = c.createRadialGradient(-12, CY - 14, 4, 0, CY, R);
    gg.addColorStop(0, '#fff6c0'); gg.addColorStop(0.4, '#ffd23a');
    gg.addColorStop(0.85, '#b07a0a'); gg.addColorStop(1, '#5a3a02');
    c.fillStyle = gg; c.beginPath(); c.arc(0, CY, R, 0, PI * 2); c.fill();
    c.save(); c.beginPath(); c.arc(0, CY, R - 1, 0, PI * 2); c.clip();
    c.strokeStyle = 'rgba(30,50,200,.75)'; c.lineWidth = 3;
    var giro = (t * 0.25) % 1;
    for (var m = 0; m < 5; m++) {
      var k = ((m / 5 + giro) % 1) * 2 - 1;
      c.beginPath();
      c.ellipse(k * R * 0.9, CY, Math.max(1, R * 0.28 * Math.sqrt(1 - k * k)), R, 0, -PI / 2 + 0.5, PI / 2 - 0.5);
      c.stroke();
    }
    for (var pa = -1; pa <= 1; pa++) {
      c.beginPath(); c.ellipse(0, CY + pa * 16, R * Math.sqrt(1 - pa * pa * 0.18), 5, 0, 0.3, PI - 0.3); c.stroke();
    }
    c.restore();
    c.lineWidth = 2.4; c.strokeStyle = '#5a3a02'; c.beginPath(); c.arc(0, CY, R, 0, PI * 2); c.stroke();
    var a = t * 1.3;
    if (Math.cos(a) > 0) pac(c, Math.sin(a) * (R + 2), CY + 4, 7, 0, 0.3 + 0.3 * Math.abs(Math.sin(t * 8)));
    gema(c, 0, 20, 7, '#2fd07a', resp);
  }

  /* ---------- el marco: sombra, halo, destellos y el brillo que la recorre ---------- */
  function copa(c, t, dibujo, desfase) {
    var resp = 0.5 + 0.5 * Math.sin(t * 1.6);
    c.save();
    c.translate(100, 128); c.scale(0.86, 0.86);
    c.fillStyle = 'rgba(0,0,0,.5)';
    c.beginPath(); c.ellipse(0, 100, 69, 6, 0, 0, PI * 2); c.fill();
    var h = c.createRadialGradient(0, -30, 10, 0, -30, 110);
    h.addColorStop(0, rgba('#ffe23a', 0.2 + 0.1 * resp)); h.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = h; c.fillRect(-116, -148, 232, 270);
    dibujo(c, ORO, t, resp);
    for (var s = 0; s < 5; s++) {
      var a = t * 0.5 + s * PI * 2 / 5;
      var x = Math.cos(a) * 92, y = -30 + Math.sin(a) * 70;
      var tw = 0.5 + 0.5 * Math.sin(t * 3 + s * 1.7), L = 3 + 4 * tw;
      c.save();
      c.globalAlpha *= 0.35 + 0.65 * tw;
      c.fillStyle = '#fff6c8';
      c.beginPath();
      c.moveTo(x, y - L); c.lineTo(x + 1.2, y - 1.2); c.lineTo(x + L, y);
      c.lineTo(x + 1.2, y + 1.2); c.lineTo(x, y + L); c.lineTo(x - 1.2, y + 1.2);
      c.lineTo(x - L, y); c.lineTo(x - 1.2, y - 1.2); c.closePath(); c.fill();
      c.restore();
    }
    c.restore();
    var ciclo = (t * 0.3 + desfase) % 1;
    if (ciclo < 0.4) {
      var bx = -60 + ciclo / 0.4 * 320;
      c.save();
      c.globalCompositeOperation = 'source-atop';
      var sg = c.createLinearGradient(bx - 26, 0, bx + 26, 0);
      sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, 'rgba(255,255,255,.24)');
      sg.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = sg;
      c.transform(1, 0, -0.35, 1, 0, 0);
      c.fillRect(bx - 26, 0, 52, 240);
      c.restore();
    }
  }

  /* ---------- la página ---------- */
  var COPAS = [
    { letra: 'A', nombre: 'EL CÁLIZ IMPERIAL', dibujo: caliz,
      texto: 'Una copa de verdad, la más grande de la escalera: tapa con corona, asas, Pac-Man en un medallón y los cuatro fantasmas en gemas. Es la que mejor continúa las otras cinco copas.' },
    { letra: 'B', nombre: 'EL PAC-MAN DE ORO', dibujo: pacOro,
      texto: 'Ya no es una copa: es una estatua. Pac-Man de oro macizo, coronado, sobre su columna y a punto de comerse la superpastilla. Se reconoce hasta en miniatura.' },
    { letra: 'C', nombre: 'EL PLANETA', dibujo: planeta,
      texto: 'El mundo es el laberinto, con un anillo como el de Saturno hecho de puntos y Pac-Man dándole la vuelta por delante y por detrás.' },
    { letra: 'D', nombre: 'LA CORONA', dibujo: corona,
      texto: 'El premio es la corona misma, sobre su cojín: cada punta lleva el color de un fantasma y en la del centro, Pac-Man.' }
  ];

  var lienzos = [];
  function alta(canvas, dibujo, desfase) {
    lienzos.push({ el: canvas, ctx: canvas.getContext('2d'), d: dibujo, f: desfase, w: 0 });
  }
  alta(document.getElementById('lienzo-hoy'), hoy, 0.5);
  var caja = document.getElementById('copas');
  COPAS.forEach(function (k, i) {
    var u = document.createElement('article'); u.className = 'urna'; u.id = 'copa-' + k.letra;
    var letra = document.createElement('div'); letra.className = 'letra'; letra.textContent = 'OPCIÓN ' + k.letra;
    var grande = document.createElement('canvas'); grande.className = 'grande'; grande.width = 200; grande.height = 240;
    grande.setAttribute('aria-label', k.nombre.toLowerCase());
    var pie = document.createElement('div'); pie.className = 'pie';
    var mini = document.createElement('div'); mini.className = 'mini';
    var chico = document.createElement('canvas'); chico.width = 200; chico.height = 240;
    chico.setAttribute('aria-label', k.nombre.toLowerCase() + ', en miniatura');
    var cap = document.createElement('span'); cap.textContent = 'escalera';
    mini.appendChild(chico); mini.appendChild(cap);
    var texto = document.createElement('div'); texto.className = 'texto';
    var h = document.createElement('h2'); h.textContent = k.nombre;
    var p = document.createElement('p'); p.textContent = k.texto;
    texto.appendChild(h); texto.appendChild(p);
    pie.appendChild(mini); pie.appendChild(texto);
    u.appendChild(letra); u.appendChild(grande); u.appendChild(pie);
    caja.appendChild(u);
    alta(grande, k.dibujo, i * 0.23);
    alta(chico, k.dibujo, i * 0.23);
  });

  var quieto = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  function cuadro(ms) {
    var t = quieto ? 1.2 : ms / 1000;
    var dpr = Math.min(3, window.devicePixelRatio || 1);
    for (var i = 0; i < lienzos.length; i++) {
      var L = lienzos[i], w = Math.round((L.el.clientWidth || 200) * dpr);
      if (w !== L.w) { L.w = w; L.el.width = w; L.el.height = Math.round(w * 1.2); }
      var c = L.ctx, k = w / 200;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, L.el.width, L.el.height);
      c.setTransform(k, 0, 0, k, 0, 0);
      copa(c, t, L.d, L.f);
    }
    if (!quieto) requestAnimationFrame(cuadro);
  }
  requestAnimationFrame(cuadro);
  if (quieto) window.addEventListener('resize', function () { requestAnimationFrame(cuadro); });
})();
</script>
