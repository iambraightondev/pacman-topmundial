<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Objetos en el juego</title>
<style>
  body { margin: 0; background: #0b0b12; color: #ddd; font: 12px monospace; }
  canvas { display: block; }
</style>
</head>
<body>
<!-- Hoja de contacto de la tanda objetos con el código DEL JUEGO (js/config.js,
     js/sprites.js y js/skins.js), para comprobar que el dibujo es el del
     escaparate y que los accesorios casan. Se sirve con Node desde la raíz
     del repo (node tests/servidor.cjs 8437) y se abre, por ejemplo:

       /propuestas/vestuario-objetos/en-el-juego.html?modo=medir&ids=discos,tele
       ?modo=acc&ids=camara&accs=acc_gafas,acc_chistera&k=6
       ?modo=anim&ids=caja&k=6          (andando, la Q y la muerte)
       ?modo=efx&ids=efx_neon&k=4     (los efectos, andando)
       ?modo=emo&ids=alucinado,chist&k=6    (los emotes, en su globo)

     k es la escala (3 = tamaño de partida) y c el color (%23ff0000). -->
<canvas id="cv"></canvas>
<script src="../../js/config.js"></script>
<script src="../../js/sprites.js"></script>
<script src="../../js/skins.js"></script>
<script>
(function () {
  var Q = new URLSearchParams(location.search);
  var S = window.PM.Sprites, CFG = window.PM.CFG;
  var modo = Q.get('modo') || 'anim';
  var ids = (Q.get('ids') || 'discos,tele,cabina,camara,reloj,semaforo,caja,bola').split(',');
  var accs = (Q.get('accs') || '').split(',').filter(Boolean);
  var K = parseFloat(Q.get('k') || '6');
  var col = Q.get('c') || '#ffff00';
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var CEL = 34;                     // lado de cada celda, en unidades del juego

  function lienzo(cols, filas, cel) {
    cv.width = Math.ceil(cols * cel * K) + 90;
    cv.height = Math.ceil(filas * cel * K) + 20;
    ctx.fillStyle = '#0b0b12'; ctx.fillRect(0, 0, cv.width, cv.height);
  }
  function rotulo(txt, x, y) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#9ab'; ctx.font = '11px monospace';
    ctx.fillText(txt, x, y);
  }
  function celda(c, f, cel) {
    ctx.setTransform(K, 0, 0, K, 90 + c * cel * K, 10 + f * cel * K);
    ctx.fillStyle = '#10101a'; ctx.fillRect(0.5, 0.5, cel - 1, cel - 1);
    /* un pasillo del juego, para ver el tamaño */
    ctx.strokeStyle = '#2121de'; ctx.lineWidth = 1 / K;
    ctx.strokeRect(1, cel / 2 - 8, cel - 2, 16);
  }

  if (modo === 'medir') {
    /* la skin grande, quieta en la pose de medir (t 0,3, boca cerrada), con
     * la rejilla del marco (f a la derecha, s arriba) y lo apuntado en
     * CABEZAS: ojo rojo, coronilla verde, cuello azul */
    var cel = 30;
    lienzo(ids.length, 1, cel);
    ids.forEach(function (id, i) {
      ctx.setTransform(K, 0, 0, K, 90 + i * cel * K, 10);
      ctx.fillStyle = '#10101a'; ctx.fillRect(0, 0, cel, cel);
      var cx = cel / 2, cy = cel / 2;
      S.drawPacman(ctx, cx, cy, 3, 0, col, id, { t: 0.3 });
      ctx.lineWidth = 1 / K;
      for (var u = -14; u <= 14; u++) {
        ctx.strokeStyle = u === 0 ? 'rgba(255,255,255,.5)' : (u % 5 ? 'rgba(255,255,255,.07)' : 'rgba(255,255,255,.22)');
        ctx.beginPath(); ctx.moveTo(cx + u, 0); ctx.lineTo(cx + u, cel); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, cy - u); ctx.lineTo(cel, cy - u); ctx.stroke();
      }
      var c = S.CABEZAS[id];
      if (c) {
        [['ojo', '#f33'], ['coronilla', '#3f3'], ['cuello', '#39f']].forEach(function (m) {
          if (!c[m[0]]) return;
          ctx.fillStyle = m[1];
          ctx.beginPath(); ctx.arc(cx + c[m[0]][0], cy - c[m[0]][1], 0.45, 0, Math.PI * 2); ctx.fill();
        });
      }
      rotulo(id, 92 + i * cel * K, cel * K + 8);
    });
    return;
  }

  if (modo === 'acc') {
    /* filas: skins; columnas: accesorios. t fijo (tq) o varios instantes */
    var t0 = parseFloat(Q.get('t') || '0.3');
    var qs = Q.get('q') ? parseFloat(Q.get('q')) : null;
    var boca = parseInt(Q.get('boca') || '0', 10);
    var cel2 = 30;
    lienzo(accs.length, ids.length, cel2);
    ids.forEach(function (id, f) {
      rotulo(id, 4, 10 + (f + 0.5) * cel2 * K);
      accs.forEach(function (a, c) {
        ctx.setTransform(K, 0, 0, K, 90 + c * cel2 * K, 10 + f * cel2 * K);
        ctx.fillStyle = '#10101a'; ctx.fillRect(0.5, 0.5, cel2 - 1, cel2 - 1);
        S.drawPacman(ctx, cel2 / 2, cel2 / 2 + 2, 3, boca, col, id,
          { t: t0, accesorio: a, qSeg: qs, muerde: qs != null && qs < 0.4, mordio: qs != null });
        if (f === 0) rotulo(a.replace('acc_', ''), 92 + c * cel2 * K, 9);
      });
    });
    return;
  }

  if (modo === 'anim') {
    /* andando (boca 0,1,2 a distintos t), la Q en cinco momentos y la
     * muerte en seis; con ?acc= lleva ese accesorio */
    var acc = Q.get('acc') || null;
    var cols = [
      { n: 'anda 0.1', t: 0.1, boca: 0 }, { n: 'anda 0.5', t: 0.5, boca: 1 }, { n: 'anda 0.9', t: 0.9, boca: 2 },
      { n: 'Q .05', q: 0.05 }, { n: 'Q .25', q: 0.25 }, { n: 'Q .45', q: 0.45 }, { n: 'Q .7', q: 0.7 }, { n: 'Q .95', q: 0.95 },
      { n: 'muere .1', m: 0.1 }, { n: '.3', m: 0.3 }, { n: '.5', m: 0.5 }, { n: '.65', m: 0.65 }, { n: '.8', m: 0.8 }, { n: '.95', m: 0.95 }
    ];
    var cel3 = 30;
    lienzo(cols.length, ids.length, cel3);
    ids.forEach(function (id, f) {
      rotulo(id, 4, 10 + (f + 0.5) * cel3 * K);
      cols.forEach(function (cc, c) {
        ctx.setTransform(K, 0, 0, K, 90 + c * cel3 * K, 10 + f * cel3 * K);
        ctx.fillStyle = '#10101a'; ctx.fillRect(0.5, 0.5, cel3 - 1, cel3 - 1);
        var x = cel3 / 2, y = cel3 / 2 + 2;
        if (cc.m != null) S.drawSkinDeath(ctx, x, y, cc.m, col, id, 3);
        else if (cc.q != null) {
          var tq = 2 + cc.q;
          S.drawPacman(ctx, x, y, 3, 2, col, id, { t: tq, qSeg: cc.q * 1.0 * durQ(id), muerde: cc.q < 0.3, mordio: true, accesorio: acc });
        } else S.drawPacman(ctx, x, y, 3, cc.boca, col, id, { t: cc.t, accesorio: acc });
        if (f === 0) rotulo(cc.n, 92 + c * cel3 * K, 9);
      });
    });
    return;
  }

  if (modo === 'efx') {
    /* el efecto sobre un CLÁSICO que avanza por un pasillo recto */
    var n = 4, cel4 = 60;
    lienzo(n, ids.length, cel4);
    ids.forEach(function (id, f) {
      rotulo(id, 4, 10 + (f + 0.5) * cel4 * K);
      for (var c = 0; c < n; c++) {
        ctx.setTransform(K, 0, 0, K, 90 + c * cel4 * K, 10 + f * cel4 * K);
        ctx.fillStyle = '#10101a'; ctx.fillRect(0.5, 0.5, cel4 - 1, cel4 - 1);
        var s = 60 + c * 17, t = 1 + c * 0.37, x = cel4 - 10, y = cel4 / 2 + 6;
        S.drawPacman(ctx, x, y, 3, c % 3, col, Q.get('skin') || 'clasico',
          { t: t, s: s, efecto: id, back: function (dist) { return { x: x - dist, y: y, d: 3 }; } });
      }
    });
    return;
  }

  if (modo === 'emo') {
    var n5 = 6, cel5 = 40;
    lienzo(n5, ids.length, cel5);
    ids.forEach(function (id, f) {
      rotulo(id, 4, 10 + (f + 0.5) * cel5 * K);
      for (var c = 0; c < n5; c++) {
        ctx.setTransform(K, 0, 0, K, 90 + c * cel5 * K, 10 + f * cel5 * K);
        ctx.fillStyle = '#10101a'; ctx.fillRect(0.5, 0.5, cel5 - 1, cel5 - 1);
        S.drawPacman(ctx, cel5 / 2, cel5 - 9, 3, 0, col, "clasico", { t: 1 });
        S.drawEmote(ctx, cel5 / 2, cel5 - 20, id, col, c * 23 + 5);
      }
    });
  }

  /* lo que dura la Q de cada una (el qDe de su dibujo) */
  function durQ(id) {
    var D = { discos: 1.1, tele: 0.9, cabina: 1.0, camara: 0.7, reloj: 1.0,
      semaforo: 1.0, caja: 1.2, bola: 1.3 };
    return D[id] || 1;
  }
})();
</script>
</body>
</html>
